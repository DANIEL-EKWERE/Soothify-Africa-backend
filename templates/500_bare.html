<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong — Soothify Africa</title>

  <!--
    The fallback behind 500.html, and the only page in the project that
    reaches for nothing at all: no base template, no stylesheet, no static
    files, no context processors, no named URL, no translation. It is
    rendered when rendering the real 500 page has itself failed, which is
    the one moment when every one of those is suspect.

    Inline styles are the point here, not an oversight.
  -->
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 48px 24px; background: #FFF; color: #0D0D0D; text-align: center;
      font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 540px; }
    .code { margin: 0; font-size: 72px; font-weight: 700; line-height: 1; }
    h1 { margin: 32px 0 0; font-size: 18px; font-weight: 700; line-height: 1.35; }
    p { margin: 32px 0 0; font-size: 16px; line-height: 1.55; color: #4F5B62; }
    a {
      display: inline-block; margin-top: 40px; padding: 15px 28px;
      border-radius: 8px; background: #2F6FED;
      font-size: 16px; font-weight: 600; color: #FFF; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">500</p>
    <h1>Something Went Wrong At Our End</h1>
    <p>
      This one is ours, not yours. It has been logged and we are already
      looking at it. Give it a moment and try again.
    </p>
    <a href="/">Go back to homepage</a>
  </main>
</body>
</html>
