# nginx in front of the API, on the AWS box.
#
# /etc/nginx/sites-available/soothify-api  →  symlink into sites-enabled/
# Certbot rewrites this file when it installs the certificate, adding the
# 443 server block and the redirect; what is here is what it starts from.

upstream soothify_api {
    server unix:/run/soothify/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name api.soothifyafrica.com.ng;

    # Audio and video uploads from the content team go through here.
    client_max_body_size 512M;

    # Transcoding and S3 uploads are slow; the default 60s cuts them off.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /static/ {
        alias /srv/soothify/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Uploaded media is private and signed per request (see api/media.py),
    # so it is NOT served from disk here -- it goes through Django, which
    # checks the signature first.
    #
    # If a future change does serve media from disk, everything under
    # media/private/ must still be refused: practising certificates and
    # government IDs live there.
    location /media/private/ {
        deny all;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER reads this. Without it Django redirects
        # every request to https forever.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://soothify_api;
    }
}
